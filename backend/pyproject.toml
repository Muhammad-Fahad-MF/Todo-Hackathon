[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "pydantic-settings>=2.12.0",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.40.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "python-json-logger>=2.0.7",
    "PyJWT>=2.8.0",
    "mypy>=1.19.1",
]

[project.optional-dependencies]
dev = [
    "pydantic-to-typescript>=1.0.0",
]

[tool.mypy]
plugins = [
    "pydantic.mypy"
]
