[project]
name = "todo-hackathon"
version = "0.1.0"
description = "A strictly typed in-memory todo app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer",
    "rich"
]

[project.scripts]
todo = "todo.main:app"

# This tells uv to treat the src folder as the root for your code


# --- ADD THESE SECTIONS BELOW ---



[tool.setuptools.packages.find]
where = ["."]
include = ["todo*"]
exclude = ["specs*", "history*"]


[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"