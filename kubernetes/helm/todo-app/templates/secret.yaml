apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-secrets
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | b64enc | quote }}
  ALEMBIC_DATABASE_URL: {{ .Values.secrets.ALEMBIC_DATABASE_URL | b64enc | quote }}
  CORS_ORIGINS: {{ .Values.secrets.CORS_ORIGINS | b64enc | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.BETTER_AUTH_SECRET | b64enc | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | b64enc | quote }}
  OPENAI_BASE_URL: {{ .Values.secrets.OPENAI_BASE_URL | b64enc | quote }}
  NEXT_PUBLIC_API_URL: {{ .Values.secrets.NEXT_PUBLIC_API_URL | b64enc | quote }}