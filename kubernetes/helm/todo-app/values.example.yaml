# Default values for todo-app.
# This is a YAML-formatted file.

global:
  env:
    ENVIRONMENT: "development"

# Shared secrets (base64 encoded in the secret.yaml template)
secrets:
  DATABASE_URL: "postgresql+asyncpg://user:pass@host/db"
  ALEMBIC_DATABASE_URL: "postgresql://user:pass@host/db?sslmode=require"
  CORS_ORIGINS: '["*"]'
  BETTER_AUTH_SECRET: "YOUR_GENERATED_SECRET"
  OPENAI_API_KEY: "gsk_YOUR_GROQ_API_KEY"
  OPENAI_BASE_URL: "https://api.groq.com/openai/v1"
  NEXT_PUBLIC_API_URL: "http://todo.local"
  NEXT_PUBLIC_APP_URL: "http://todo.local"
  BETTER_AUTH_URL: "http://todo.local"
  BETTER_AUTH_USE_SECURE_COOKIES: "false"

backend:
  replicaCount: 1
  image:
    repository: todo-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    name: http

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  startupProbe:
    httpGet:
      path: /health
      port: http
    timeoutSeconds: 5
    failureThreshold: 30
    periodSeconds: 10
    
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
    
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

frontend:
  replicaCount: 1
  image:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    name: http

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  startupProbe:
    httpGet:
      path: /
      port: http
    timeoutSeconds: 5
    failureThreshold: 30
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: todo.local
      paths:
        - path: /api/auth
          pathType: Prefix
          backend: frontend
        - path: /api/external
          pathType: Prefix
          backend: frontend
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend
  tls: []

autoscaling:
  enabled: false
